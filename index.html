<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google</title>

<style>

body {
    margin:0;
    background:white;
    font-family:Arial, Helvetica, sans-serif;
}


/* Top navigation */

.top {
    position:absolute;
    top:5px;
    left:15px;
    right:15px;
    font-size:13px;
}

.top a {
    color:#00c;
    text-decoration:none;
    margin-right:12px;
}

.top a:hover {
    text-decoration:underline;
}

.top .right {
    float:right;
}

.top .right a {
    margin-left:15px;
    margin-right:0;
}


/* Main Google area */

.center {
    text-align:center;
    margin-top:120px;
}

.logo {
    width:275px;
}


.searchbox {
    width:520px;
    height:30px;
    margin-top:10px;
    border:1px solid #999;
    padding:2px 8px;
    font-size:16px;
}


.buttons {
    margin-top:20px;
}


.buttons input {
    padding:5px 14px;
    font-size:13px;
}


/* Footer */

.footer {
    position:fixed;
    bottom:25px;
    width:100%;
    text-align:center;
    font-size:13px;
}

.footer a {
    color:#00c;
    text-decoration:none;
    margin:0 10px;
}



/* Sign in popup */

#signin {

    display:none;

    position:fixed;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    width:360px;

    background:white;

    border-radius:12px;

    padding:35px;

    text-align:center;

    box-shadow:0 5px 30px rgba(0,0,0,.35);

    border:1px solid #ddd;
}


.signin-logo {
    width:170px;
}


#signin h2 {
    font-size:26px;
    margin:15px 0 5px;
}


#signin p {
    color:#555;
}


#signin input {

    width:100%;

    box-sizing:border-box;

    padding:12px;

    margin:8px 0;

    border:1px solid #aaa;

    border-radius:5px;

}


#signin button {

    width:100%;

    padding:12px;

    margin-top:12px;

    background:#4285f4;

    color:white;

    border:0;

    border-radius:5px;

    cursor:pointer;

}


#signin button:hover {

    background:#3367d6;

}


.close {

    float:right;

    cursor:pointer;

    font-size:22px;

}


.create {

    display:block;

    margin-top:20px;

    color:#4285f4;

    text-decoration:none;

}

</style>

</head>


<body>


<!-- Top links -->

<div class="top">

<a href="https://www.google.com/">
Search
</a>

<a href="https://images.google.com/">
Images
</a>

<a href="https://maps.google.com/">
Maps
</a>

<a href="https://play.google.com/">
Play
</a>

<a href="https://www.youtube.com/">
YouTube
</a>

<a href="https://news.google.com/">
News
</a>

<a href="https://photos.google.com/">
Photos
</a>

<a href="https://sheets.google.com/">
Sheets
</a>

<a href="https://slides.google.com/">
Slides
</a>

<a href="https://docs.google.com/">
Docs
</a>


<div class="right">

<a href="https://www.google.com/preferences">
Search settings
</a>

<a href="#" onclick="loginBox();return false;">
Sign in
</a>

</div>

</div>




<!-- Google homepage -->

<div class="center">

<img class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Google_logo_%282010-2013%29.svg/1280px-Google_logo_%282010-2013%29.svg.png"
alt="Google">


<form action="https://www.google.com/search" method="GET">


<input class="searchbox"
type="text"
name="q"
autocomplete="off"
autofocus>


<div class="buttons">

<input type="submit"
value="Google Search">


<input type="submit"
name="btnI"
value="I'm Feeling Lucky">

</div>


</form>

</div>




<!-- Footer -->

<div class="footer">

<a href="#">
Advertising Programs
</a>

<a href="#">
Business Solutions
</a>

<a href="#">
About Google
</a>

</div>




<!-- Custom sign in -->

<div id="signin">

<span class="close" onclick="closeLogin()">
×
</span>


<img class="signin-logo"
src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Google_logo_%282010-2013%29.svg/1280px-Google_logo_%282010-2013%29.svg.png">


<h2>
Sign in
</h2>


<p>
Use your account to continue
</p>


<form action="#" method="post">

<input type="text"
placeholder="Email or username"
required>


<input type="password"
placeholder="Password"
required>


<button type="submit">
Sign in
</button>

</form>


<a class="create" href="#">
Create account
</a>


</div>




<script>

function loginBox(){

document.getElementById("signin").style.display="block";

}


function closeLogin(){

document.getElementById("signin").style.display="none";

}

</script>


</body>
</html>
